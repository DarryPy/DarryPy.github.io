<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>404 · 迷路了 · DarryPy</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{
  --bg-1:#06080f;
  --t1:#f0f8ff;
  --t2:#a6c1de;
  --t3:#5b7693;
  --blue:#38bdf8;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.18);
  --surface:rgba(17,30,48,.55);
  --grad:linear-gradient(135deg,#38bdf8 0%,#818cf8 45%,#c084fc 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg-1);
  color:var(--t1);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.bg-canvas{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 20% 30%,rgba(56,189,248,.18) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(192,132,252,.16) 0%,transparent 40%),
    linear-gradient(180deg,#06080f 0%,#0d1520 100%);
}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:-1;animation:float 22s ease-in-out infinite}
.orb-1{width:380px;height:380px;background:#38bdf8;top:-100px;left:-100px}
.orb-2{width:340px;height:340px;background:#c084fc;bottom:-100px;right:-100px;animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}

.wrap{text-align:center;max-width:560px;position:relative;z-index:1}
.code-404{
  font-size:clamp(80px,18vw,160px);
  font-weight:900;
  letter-spacing:-6px;
  line-height:1;
  background:var(--grad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:14px;
  filter:drop-shadow(0 10px 28px rgba(56,189,248,.3));
}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px;color:var(--t1)}
.desc{font-size:15px;color:var(--t2);line-height:1.7;margin-bottom:36px}
.desc code{
  font-family:'JetBrains Mono','SF Mono','Menlo','Consolas',monospace;
  font-size:.88em;
  padding:2px 8px;
  background:rgba(56,189,248,.1);
  color:#7dd3fc;
  border-radius:4px;
  border:1px solid rgba(56,189,248,.18);
  word-break:break-all;
}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 22px;
  border-radius:12px;
  font-size:14.5px;font-weight:700;
  text-decoration:none;
  border:1px solid transparent;
  transition:transform .15s,box-shadow .2s,background .2s;
  cursor:pointer;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 24px rgba(56,189,248,.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(56,189,248,.4)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--t1);border-color:var(--border-strong)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
@media(max-width:640px){
  .btn{flex:1;justify-content:center;min-width:0}
}
</style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="wrap">
    <div class="code-404">404</div>
    <h1>迷路了</h1>
    <p class="desc">
      你访问的 <code id="path"></code> 不存在 —— 也许是输错了，也许是文章被搬走了。<br/>
      回首页或者看看最新文章吧。
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">回首页 →</a>
      <a href="/#posts" class="btn btn-ghost">看文章</a>
    </div>
  </div>
  <script>
    document.getElementById('path').textContent = location.pathname;
  </script>
</body>
</html>
