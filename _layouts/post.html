<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#06080f" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>{{ page.title }} · DarryPy</title>
<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
<style>
:root{
  --bg-1:#06080f;
  --bg-2:#0d1520;
  --surface:rgba(17,30,48,.55);
  --surface-2:rgba(17,30,48,.85);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.18);
  --t1:#f0f8ff;
  --t2:#a6c1de;
  --t3:#5b7693;
  --blue:#38bdf8;
  --purple:#c084fc;
  --green:#34d399;
  --grad:linear-gradient(135deg,#38bdf8 0%,#818cf8 45%,#c084fc 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg-1);
  color:var(--t1);
  line-height:1.8;
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(56,189,248,.3);transition:border-color .2s,color .2s}
a:hover{color:#7dd3fc;border-bottom-color:var(--blue)}

/* bg orbs */
.bg-canvas{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 10% 0%,rgba(56,189,248,.16) 0%,transparent 35%),radial-gradient(circle at 90% 100%,rgba(192,132,252,.16) 0%,transparent 35%),linear-gradient(180deg,#06080f 0%,#0d1520 100%)}
.bg-orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.32;animation:float 26s ease-in-out infinite}
.orb-1{width:440px;height:440px;background:#38bdf8;top:-160px;left:-120px}
.orb-2{width:420px;height:420px;background:#c084fc;bottom:-140px;right:-120px;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.05)}}

/* nav */
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 32px;
  background:rgba(6,8,15,.55);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;text-decoration:none;border:none}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 16px rgba(56,189,248,.7)}
.brand-name{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-back{color:var(--t2);font-size:13.5px;border:none}

/* article */
article{max-width:760px;margin:0 auto;padding:80px 24px 120px}
.post-header{margin-bottom:48px}
.post-tag{
  display:inline-block;font-size:11px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;
  color:var(--blue);
  padding:5px 12px;
  background:rgba(56,189,248,.1);
  border:1px solid rgba(56,189,248,.3);
  border-radius:999px;
  margin-bottom:18px;
}
.post-h1{
  font-size:clamp(28px,4.2vw,42px);
  font-weight:900;
  letter-spacing:-.5px;
  line-height:1.2;
  margin-bottom:14px;
}
.post-meta{
  display:flex;gap:14px;align-items:center;
  font-size:13px;color:var(--t3);
  font-variant-numeric:tabular-nums;
}
.post-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--t3)}

/* markdown content */
.post-content{font-size:16px;color:var(--t1)}
.post-content > * + *{margin-top:20px}
.post-content h1,.post-content h2,.post-content h3,.post-content h4{
  font-weight:800;letter-spacing:-.3px;line-height:1.3;
  margin-top:48px;margin-bottom:14px;
}
.post-content h1{font-size:28px}
.post-content h2{font-size:24px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.post-content h3{font-size:19px;color:var(--t1)}
.post-content h4{font-size:16px;color:var(--t2)}
.post-content p{color:var(--t1);line-height:1.85}
.post-content strong{color:#fff;font-weight:700}
.post-content em{color:var(--purple);font-style:italic}
.post-content ul,.post-content ol{padding-left:1.5em}
.post-content li{margin-bottom:6px;color:var(--t1)}
.post-content li::marker{color:var(--blue)}
.post-content blockquote{
  padding:14px 20px;
  background:var(--surface);
  border-left:3px solid var(--blue);
  border-radius:0 10px 10px 0;
  color:var(--t2);
  font-style:italic;
}
.post-content blockquote p{color:var(--t2)}
.post-content code{
  font-family:'JetBrains Mono','SF Mono','Menlo','Consolas',monospace;
  font-size:.88em;
  padding:2px 6px;
  background:rgba(56,189,248,.1);
  color:#7dd3fc;
  border-radius:4px;
  border:1px solid rgba(56,189,248,.18);
}
.post-content pre{
  padding:18px 20px;
  background:#0a1322;
  border:1px solid var(--border);
  border-radius:12px;
  overflow-x:auto;
  font-size:13.5px;
  line-height:1.6;
}
.post-content pre code{
  background:none;border:none;padding:0;color:#dbeafe;
}
.post-content hr{
  border:0;height:1px;
  background:var(--border);
  margin:36px 0;
}
.post-content table{width:100%;border-collapse:collapse;font-size:14px}
.post-content th,.post-content td{padding:10px 14px;border:1px solid var(--border);text-align:left}
.post-content th{background:var(--surface);font-weight:700;color:var(--t1)}
.post-content td{color:var(--t2)}
.post-content img{max-width:100%;border-radius:10px;margin:8px 0}

/* footer nav */
.post-footer{
  margin-top:64px;
  padding-top:32px;
  border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;
}
.post-footer a{
  display:inline-flex;align-items:center;gap:6px;
  font-size:14px;font-weight:600;
  padding:10px 18px;
  border-radius:10px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--t1);
}
.post-footer a:hover{border-color:var(--border-strong);background:var(--surface-2)}

footer{
  padding:32px 24px;text-align:center;
  color:var(--t3);font-size:13px;
  border-top:1px solid var(--border);
  background:rgba(6,8,15,.5);
}

@media(max-width:640px){
  .nav{padding:12px 16px}
  article{padding:40px 18px 80px}
  .post-h1{letter-spacing:-.3px}
  .post-content{font-size:15.5px}
  .post-content pre{font-size:12.5px;padding:14px 16px}
  .post-content h1{font-size:24px}
  .post-content h2{font-size:21px}
  .post-content h3{font-size:18px}
  .orb{filter:blur(60px);opacity:.28}
  .orb-1{width:300px;height:300px}
  .orb-2{width:280px;height:280px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <nav class="nav">
    <a href="/" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">DarryPy</span>
    </a>
    <a href="/#posts" class="nav-back">← 返回首页</a>
  </nav>

  <article>
    <header class="post-header">
      <div class="post-tag">Post</div>
      <h1 class="post-h1">{{ page.title }}</h1>
      <div class="post-meta">
        <span>{{ page.date | date: "%Y-%m-%d" }}</span>
        {% if page.tags %}<span class="dot"></span><span>{{ page.tags | join: " · " }}</span>{% endif %}
      </div>
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    <div class="post-footer">
      <a href="/">← 回首页</a>
      <a href="/#posts">看更多文章 →</a>
    </div>
  </article>

  <footer>
    © 2026 DarryPy · Written on a quiet night
  </footer>
</body>
</html>
