<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="为什么你越在意他越疏远 — 焦虑型依恋的破解">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="50%" stop-color="#2d1f3d"/>
      <stop offset="100%" stop-color="#3d1f35"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#glow1)"/>
  <rect width="900" height="500" fill="url(#glow2)"/>

  <!-- decorative line -->
  <line x1="80" y1="120" x2="220" y2="120" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <text x="240" y="125" fill="#f472b6" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="4">EMOTIONAL · 情感专栏</text>

  <!-- main title -->
  <text x="80" y="220" fill="url(#title-grad)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="800" letter-spacing="2">为什么你越在意</text>
  <text x="80" y="290" fill="url(#title-grad)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="800" letter-spacing="2">他却越疏远？</text>

  <!-- subtitle -->
  <text x="80" y="350" fill="#e9d5ff" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" opacity="0.85" letter-spacing="1">焦虑型依恋的三个破解动作</text>

  <!-- decorative bottom -->
  <line x1="80" y1="420" x2="820" y2="420" stroke="#c084fc" stroke-width="0.8" opacity="0.3"/>
  <text x="80" y="450" fill="#a6c1de" font-family="sans-serif" font-size="13" opacity="0.6">基于成人依恋理论 · 5 分钟读完 · 收藏可反复对照</text>

  <!-- small heart -->
  <g transform="translate(770, 200) scale(2.5)">
    <path d="M 12 21 C -2 12 4 0 12 6 C 20 0 26 12 12 21 Z" fill="#f472b6" opacity="0.85"/>
  </g>
</svg>
